
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Broken Image Detector Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f8;
        }

        h1 {
            color: #183153;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 240px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        img {
            display: block;
            width: 220px;
            height: 150px;
            border: 1px solid #999;
            object-fit: contain;
        }

        .valid {
            color: green;
        }

        .broken {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Broken Image Detector</h1>
    <p>This page demonstrates two valid and two broken images.</p>

    <div class="container">

        <div class="card">
            <h3 class="valid">Valid Image 1</h3>
            <img src="images/valid1.jpg" alt="Valid Image 1">
            <p>Expected status: VALID</p>
        </div>

        <div class="card">
            <h3 class="valid">Valid Image 2</h3>
            <img src="images/valid2.jpg" alt="Valid Image 2">
            <p>Expected status: VALID</p>
        </div>

        <div class="card">
            <h3 class="broken">Broken Image 1</h3>
            <img src="images/missing1.jpg" alt="Broken Image 1">
            <p>Expected status: BROKEN</p>
        </div>

        <div class="card">
            <h3 class="broken">Broken Image 2</h3>
            <img src="images/missing2.jpg" alt="Broken Image 2">
            <p>Expected status: BROKEN</p>
        </div>

    </div>
</body>
</html>
